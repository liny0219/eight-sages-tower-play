<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091b22">
  <meta name="description" content="歧路 · 八贤之塔：八方旅人世界观下的同人卡牌爬塔游戏。欧休提三职业、72张卡、32件遗物，登上莱拉主持的八贤之塔。">
  <title>歧路 · 八贤之塔 · 在线试玩</title>
  <style>
    :root{color-scheme:dark;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#07171e;color:#f3e9d2}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{overscroll-behavior:none}
    #canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:block;outline:0;touch-action:none}
    #safe-area{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #gate{position:fixed;inset:0;z-index:2;background:#07171e}
    #gate-frame{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform-origin:center;display:flex;overflow-y:auto;overscroll-behavior:contain;padding:40px 64px;background:linear-gradient(90deg,rgba(5,20,28,.97),rgba(5,20,28,.78)),url('cover.png') center/cover}
    .invitation{width:min(1060px,100%);text-align:center;margin:auto;flex-shrink:0}.crest{width:56px;height:56px;margin-bottom:8px}
    .eyebrow{font-size:22px;letter-spacing:.35em;color:#dabc7e;margin:0 0 12px}h1{font-weight:500;letter-spacing:.12em;font-size:62px;line-height:1.2;margin:0 0 20px}
    .lead{color:#b1c7c5;font-size:var(--body-font,28px);line-height:1.65;margin:0 0 24px}.actions{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}
    button,a{font:inherit}button{min-height:var(--tap-height,110px);border:3px solid #59726e;border-radius:0;padding:20px 44px;background:#142b33;color:#edebd8;font-size:var(--action-font,32px);cursor:pointer;box-shadow:4px 4px 0 #041117}
    button:hover{border-color:#f3de9f;background:#213c43}button:focus-visible,a:focus-visible{outline:4px solid #f3de9f;outline-offset:6px}
    #start{background:#dabc7e;border-color:#dabc7e;color:#11252a;min-width:370px}button:disabled{opacity:.6;cursor:wait}
    #display-fit{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));min-height:48px;max-width:calc(100vw - max(12px,env(safe-area-inset-left)) - max(12px,env(safe-area-inset-right)));padding:10px 16px;border-width:2px;border-radius:0;font-size:15px;line-height:1.4;touch-action:manipulation}
    #display-fit span,#display-fit small{display:block}#display-fit small{font-size:12px;line-height:1.4;color:#b1c7c5}
    .note{font-size:var(--body-font,25px);color:#90aaa9;line-height:1.5;margin:24px 0 0}.links{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;margin-top:16px;font-size:var(--link-font,26px)}.links a{display:inline-flex;align-items:center;min-height:var(--link-height,80px);color:#dabc7e;text-decoration:none}
    .version{margin-top:16px}
    #loading{margin:20px auto 0;max-width:800px}progress{width:100%;height:12px;accent-color:#dabc7e;display:block;margin:16px 0}
    #status{font-size:var(--body-font,28px);line-height:1.5;color:#d7e4db;margin:0;white-space:pre-line}#error{overflow-wrap:anywhere;color:#ffb09c;line-height:1.6;font-size:var(--body-font,28px);margin-top:20px}
    #retry{margin-top:20px}[hidden]{display:none!important}noscript{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:#091b22;padding:36px}
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <div id="safe-area" aria-hidden="true"></div>
  <canvas id="canvas" tabindex="0" aria-label="歧路 · 八贤之塔游戏画面">浏览器需要支持 Canvas 才能游玩。</canvas>
  <section id="gate" aria-labelledby="game-title">
    <button id="display-fit" type="button" aria-pressed="false"><span>旋转画面</span><small id="display-fit-mode">当前：长边横屏</small></button>
    <div id="gate-frame">
    <div class="invitation">
      <img class="crest" src="icon.png" alt="八贤之塔徽记">
      <p class="eyebrow">TOWER OF THE EIGHT</p>
      <h1 id="game-title">歧路 · 八贤之塔</h1>
      <p class="lead">每一层，都是新的歧路。每一手，都是登顶的答案。<br>带上你的本领，赴莱拉的塔顶之约。</p>
      <div class="actions"><button id="start" type="button">开始旅程 →</button><button id="fullscreen" type="button">全屏游玩</button></div>
      <div id="loading" hidden><progress id="progress" aria-label="游戏加载进度"></progress><p id="status" role="status" aria-live="polite">正在开启塔门…</p></div>
      <p id="error" role="alert" hidden></p><button id="retry" type="button" hidden>重新加载</button>
      <p class="note">右上角可切换长边／短边横屏适配。<br>首次加载需要下载游戏资源。进度保存在当前浏览器。</p>
      <div class="links"><a href="https://github.com/liny0219/eight-sages-tower-play" target="_blank" rel="noopener">项目与操作说明 ↗</a><a href="https://liny0219.github.io/game-gallery/" target="_blank" rel="noopener">游戏集合 ↗</a></div>
      <p class="note version">《八方旅人》非官方同人作品 · <span id="loader-version">v0.2.9</span></p>
    </div>
    </div>
  </section>
  <noscript>请启用 JavaScript 后游玩《歧路 · 八贤之塔》。</noscript>
  <script src="index.js"></script>
  <script>
    'use strict';
    const canvas = document.getElementById('canvas');
    const safeArea = document.getElementById('safe-area');
    const gate = document.getElementById('gate');
    const gateFrame = document.getElementById('gate-frame');
    const fitButton = document.getElementById('display-fit');
    const fitMode = document.getElementById('display-fit-mode');
    const startButton = document.getElementById('start');
    const fullButton = document.getElementById('fullscreen');
    const progress = document.getElementById('progress');
    const status = document.getElementById('status');
    const error = document.getElementById('error');
    const retry = document.getElementById('retry');
    const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":21705044,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const GODOT_THREADS_ENABLED = false;
    let engine = null;
    let started = false;
    const DISPLAY_FIT_KEY = 'eight_sages_display_fit';
    let displayFit = 'long';
    try { displayFit = window.localStorage.getItem(DISPLAY_FIT_KEY) === 'short' ? 'short' : 'long'; } catch (_) { /* This tab still supports the preference without storage. */ }
    window.eightSagesDisplayFit = function () { return displayFit; };
    window.eightSagesSetDisplayFit = function (value) {
      displayFit = value === 'short' ? 'short' : 'long';
      try { window.localStorage.setItem(DISPLAY_FIT_KEY, displayFit); } catch (_) { /* Retain the in-memory value when storage is unavailable. */ }
      fitCanvas();
      return displayFit;
    };
    function fitCanvas() {
      const safe = getComputedStyle(safeArea);
      const left = parseFloat(safe.paddingLeft) || 0;
      const right = parseFloat(safe.paddingRight) || 0;
      const top = parseFloat(safe.paddingTop) || 0;
      const bottom = parseFloat(safe.paddingBottom) || 0;
      const availableWidth = Math.max(1, window.innerWidth - left - right);
      const availableHeight = Math.max(1, window.innerHeight - top - bottom);
      // The selected fit determines the buffer shape. Godot infers its root
      // projection from that shape; the DOM canvas itself never rotates.
      const sideways = (availableHeight > availableWidth) !== (displayFit === 'short');
      const designWidth = sideways ? 900 : 1440;
      const designHeight = sideways ? 1440 : 900;
      const scale = Math.min(availableWidth / designWidth, availableHeight / designHeight);
      const width = Math.max(1, Math.floor(designWidth * scale));
      const height = Math.max(1, Math.floor(designHeight * scale));
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      canvas.style.left = (left + availableWidth / 2) + 'px';
      canvas.style.top = (top + availableHeight / 2) + 'px';
      // The loader matches the selected game projection using only 0 or +90.
      const angle = sideways ? 90 : 0;
      gateFrame.style.left = canvas.style.left;
      gateFrame.style.top = canvas.style.top;
      gateFrame.style.transform = 'translate(-50%, -50%) rotate(' + angle + 'deg) scale(' + scale + ')';
      // Short-edge fit deliberately makes the content smaller, but its actions
      // keep physical touch/text sizes. Extra content scrolls inside the frame.
      gateFrame.style.setProperty('--tap-height',Math.max(110,48/scale) + 'px');
      gateFrame.style.setProperty('--action-font',Math.max(32,16/scale) + 'px');
      gateFrame.style.setProperty('--body-font',Math.max(28,14/scale) + 'px');
      gateFrame.style.setProperty('--link-height',Math.max(80,44/scale) + 'px');
      gateFrame.style.setProperty('--link-font',Math.max(26,13/scale) + 'px');
      fitMode.textContent = displayFit === 'short' ? '当前：短边横屏' : '当前：长边横屏';
      fitButton.setAttribute('aria-label','旋转画面，' + fitMode.textContent + '；切换' + (displayFit === 'short' ? '长边' : '短边') + '横屏');
      fitButton.setAttribute('aria-pressed',String(displayFit === 'short'));
    }
    fitCanvas();
    window.addEventListener('resize', fitCanvas);
    document.addEventListener('fullscreenchange', fitCanvas);
    window.eightSagesFullscreen = async function () {
      try {
        if (document.fullscreenElement) { await document.exitFullscreen(); return; }
        if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      } catch (_) { /* Both fit modes also work without fullscreen. */ }
      fitCanvas();
    };
    function fail(reason) {
      error.textContent = '塔门暂时未能开启。请刷新重试，或使用支持 WebGL 2 的新版 Chrome、Edge、Firefox。\n' + String(reason && reason.message || reason);
      error.hidden = false;
      retry.hidden = false;
      status.textContent = '加载未完成';
    }
    function startGame() {
      if (started) return;
      started = true;
      startButton.disabled = true;
      fullButton.disabled = true;
      document.getElementById('loading').hidden = false;
      try {
      if (typeof Engine !== 'function') { fail('引擎文件下载失败，请检查网络后重试。'); return; }
      engine = new Engine(GODOT_CONFIG);
      const missing = Engine.getMissingFeatures({threads:false});
      if (missing.length) { fail('浏览器缺少：' + missing.join('、')); return; }
      engine.startGame({
        canvas:canvas,
        canvasResizePolicy:0,
        onProgress:function(current,total) {
          if (total > 0) {
            progress.max = total;
            progress.value = current;
            status.textContent = current < total ? '正在装进行囊 · ' + Math.floor(current / total * 100) + '%' : '资源已就绪，正在点亮塔灯…';
          } else { progress.removeAttribute('value'); status.textContent = '正在装进行囊…'; }
        }
      }).then(function() {
        // Initialization may have touched buffer dimensions while resources
        // loaded. Apply the latest selection before revealing the game.
        fitCanvas();
        gate.hidden = true;
        canvas.focus();
      }, fail);
      } catch (reason) { fail(reason); }
    }
    startButton.addEventListener('click', startGame);
    fullButton.addEventListener('click', function() { window.eightSagesFullscreen(); startGame(); });
    fitButton.addEventListener('click', function() { window.eightSagesSetDisplayFit(displayFit === 'long' ? 'short' : 'long'); });
    retry.addEventListener('click', function() { window.location.reload(); });
    canvas.addEventListener('contextmenu', function(event) { event.preventDefault(); });
    if (typeof Engine !== 'function') { startButton.disabled = true; fullButton.disabled = true; fail('引擎文件下载失败，请检查网络后重试。'); }
  </script>
</body>
</html>
